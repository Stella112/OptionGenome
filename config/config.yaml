# FROZEN CONTEST CONFIGURATION - do not tune during the contest (spec section 13).
# Every number the Risk Officer enforces lives here and nowhere else.

underlyings:
  - SPY            # QQQ is added only after SPY completes one clean full session

# Entry window. Note the interaction with force_flatten_dte below: spec section 28
# check 10 requires BOTH entry_dte[0] <= dte <= entry_dte[1] AND dte > force_flatten_dte,
# so the effective openable window is 2-7 DTE. Encoded literally, not collapsed.
# CHANGED from [1, 7] -> [1, 18] on 2026-09-01 at the operator's explicit
# instruction: hold positions through the results announcement rather than
# resolving them inside the submission window.
#
# The trade-off was stated and accepted. Short-dated entries realise P&L before
# judging; an 18-DTE structure is still open at judging and shows mark-to-market
# instead. Sept 18 is the monthly expiry (586 SPY contracts vs 54 on Sept 14),
# so it is also the most liquid strike ladder in that range.
#
# To restore the original short-dated behaviour, set this back to [1, 7].
entry_dte: [1, 18]
force_flatten_dte: 1

max_loss_pct: 0.0075
daily_new_risk_pct: 0.02
dd_flatten_pct: 0.05

tp_frac_of_credit: 0.50
defend_mult: 2.0

max_lots: 1
regime_max_lots:
  INCOME: 1
  COMPRESSION: 1
  MOMENTUM: 0
  EVENT: 0

max_open_structures: 3

min_credit_to_width: 0.15
max_short_leg_spread_pct: 0.20
max_quote_age_ms: 5000

adx_trend_threshold: 25
iv_rank_low: 30

# CHANGED from 24 -> 4 on 2026-09-01, deliberately, after simulation.
# With a 24h window and events on Sep 1/2/3/4, every session sat inside the
# window of the NEXT event, so the desk classified EVENT continuously and could
# never open a position for the entire competition. Verified by simulation, not
# assumed. 4h still blocks the hours around each release (JOLTS, NFP) while
# leaving the rest of the session tradeable.
# To restore the original behaviour, set this back to 24.
event_window_hours: 4
final_session_minutes: 15
